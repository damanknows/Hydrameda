model_list:
  # --- ROLE: PLANNER (Groq -> Cerebras) ---
  - model_name: planner
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30
  - model_name: planner
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      timeout: 30

  # --- ROLE: REPOSITORY_ANALYZER (Cerebras -> Groq) ---
  - model_name: repository_analyzer
    litellm_params:
      model: cerebras/gpt-oss-120b
