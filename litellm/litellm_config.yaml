  # --- ROLE: VERIFICATION_ANALYZER (Cerebras -> Groq) ---
  - model_name: verification_analyzer
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
