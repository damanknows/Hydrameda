model_list:
  # --- NODE 1: ARCHITECT (Groq + Cerebras gpt-oss-120b) ---
  - model_name: hybrid-architect
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30
  - model_name: hybrid-architect
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      timeout: 30

  # --- NODE 2: CODER (Cerebras + Groq gpt-oss-120b) ---
  - model_name: hybrid-coder
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      timeout: 30
  - model_name: hybrid-coder
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30

  # --- HERMES WHATSAPP DEFAULT ROUTE ---
  - model_name: default
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      timeout: 30
  - model_name: default
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 30

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 30
  cooldown_time: 5

litellm_settings:
  drop_params: true
  request_timeout: 30
