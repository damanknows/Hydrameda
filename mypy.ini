[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = normal
warn_unused_configs = True
explicit_package_bases = True
exclude = (?x)(
    ^worktrees/
    | ^benchmarks/
    | ^\.venv/
    | ^\.python-3.12/
    | ^n8n_data/
    | ^lancedb_data/
    | ^exported_modules/
    | ^litellm/
  )
